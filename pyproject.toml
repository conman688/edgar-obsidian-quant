[project]
name = "edgar-obsidian-quant"
version = "0.1.0"
description = "Point-in-time SEC EDGAR screener with insider-buy tracking and an Obsidian knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0",
    "pyarrow>=15.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
